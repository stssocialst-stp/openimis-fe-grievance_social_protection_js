# This workflow publishes the npm package in two scenarios:
# 1. Automatically on every push to 'develop' (publishes with 'dev' dist-tag so the test environment always reflects the latest code)
# 2. On a published GitHub Release or manual workflow_dispatch (for official versioned releases)
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish Node.js Package

on:
  push:
    branches:
      - develop
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node version to use'
        required: true
        default: '20'
      registry_url:
        description: 'NPM registry URL'
        required: true
        default: 'https://registry.npmjs.org/'
      scope:
        description: 'Scope for npm package'
        required: false
        default: 'openimis'
      access:
        description: 'Access level for npm package'
        required: false
        default: 'public'
      tag:
        required: true

jobs:
  call-npm-publish-workflow:
    uses: openimis/openimis-fe_js/.github/workflows/module-npmpublish.yml@develop
    with:
      registry_url: 'https://registry.npmjs.org/'
      node_version: ${{ github.event.inputs.node_version || '20' }}
      access: ${{ github.event.inputs.access || 'public' }}
      scope: ${{ github.event.inputs.scope || 'openimis' }}
      tag: ${{ github.event.inputs.tag || 'dev' }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  call-gpr-publish-workflow:
    uses: openimis/openimis-fe_js/.github/workflows/module-npmpublish.yml@develop
    with:
      registry_url: 'https://npm.pkg.github.com/'
      node_version: ${{ github.event.inputs.node_version || '20' }}
      access: ${{ github.event.inputs.access || 'public' }}
      scope: ${{ github.event.inputs.scope || 'openimis' }}
      tag: ${{ github.event.inputs.tag || 'dev' }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
